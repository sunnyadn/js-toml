# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

permissions:
  contents: read

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Runners are UTC, where a host-timezone dependence in date handling is
        # invisible. One negative and one non-hour offset keep that honest.
        tz: [UTC, America/Edmonton, Australia/Adelaide]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    runs-on: ${{ matrix.os }}

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - name: Use Node.js on ${{ matrix.os }} (TZ=${{ matrix.tz }})
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: coverage
          flags: unittests,${{ matrix.os }}
        if: matrix.tz == 'UTC'
